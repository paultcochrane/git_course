name: Build document in CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Build project repo part figures
      uses: xu-cheng/latex-action@v4
      with:
        root_file: |
          working-copy-staging-repo-choc-cake-direct-commit.tex
          working-copy-staging-repo-commit-staged-files.tex
          working-copy-staging-repo-edit-choc-cake.tex
          working-copy-staging-repo-edit-pavlova.tex
          working-copy-staging-repo-initial-state.tex
          working-copy-staging-repo-stage-choc-cake.tex
          working-copy-staging-repo-stage-pavlova.tex
        texlive_version: 2026
        latexmk_use_lualatex: true
        pre_compile: "cd git/figures/project-repo-parts"

    - name: Build figures
      uses: xu-cheng/latex-action@v4
      with:
        root_file: |
          initial-wedding-scene.tex
          add-bridepair-wedding-scene.tex
          bridepair-wedding-scene.tex
          add-parents-bridepair-wedding-scene.tex
          bridepair-parents-wedding-scene.tex
          remove-parents-bridepair-wedding-scene.tex
          add-witnesses-bridepair-wedding-scene.tex
          bridepair-witnesses-wedding-scene.tex
        texlive_version: 2026
        latexmk_use_lualatex: true
        pre_compile: "cd git/figures"

    - name: Build slides
      uses: xu-cheng/latex-action@v4
      with:
        root_file: |
          overview-background-setup.tex
          git-on-your-own.tex
          git-with-others.tex
          tips-and-tricks.tex
        texlive_version: 2026
        latexmk_use_lualatex: true
        latexmk_shell_escape: true
        pre_compile: "cd git"

    - name: Release draft
      uses: softprops/action-gh-release@v3
      with:
        name: draft
        draft: true
        files: |
          git/overview-background-setup.pdf
          git/git-on-your-own.pdf
          git/git-with-others.pdf
          git/tips-and-tricks.pdf

    - name: Archive built PDF document
      uses: actions/upload-artifact@v7
      with:
        name: git-pdf
        path: |
          git/overview-background-setup.pdf
          git/git-on-your-own.pdf
          git/git-with-others.pdf
          git/tips-and-tricks.pdf
